name: Build store assets

# Play Console に貼る画像を、まとめて作って持ち帰るための仕組み。
# Actions タブから "Run workflow" を押すと、7本ぶんの
# アイコン・フィーチャーグラフィック・スクリーンショットが
# 成果物（Artifacts）として落とせるようになる。
#
# 画面を変えたら、ここをもう一度回して撮り直してください。

on:
  workflow_dispatch:
    inputs:
      app:
        description: '撮るアプリ（all で7本まとめて）'
        required: true
        default: all
        type: choice
        options:
          - all
          - synthesizer
          - piano
          - drums
          - guitar
          - bass
          - vocal
          - sampler

jobs:
  shoot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 画面の文字に日本語が含まれるので、和文の書体を入れておく。
      # 無いと日本語がすべて豆腐（□）になった画像ができあがる
      - name: Install Japanese fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-ipafont-gothic

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Take the screenshots
        run: |
          if [ "${{ inputs.app }}" = "all" ]; then
            node scripts/store-assets.mjs
          else
            node scripts/store-assets.mjs "${{ inputs.app }}"
          fi

      # 中身が空だったり、豆腐だらけだったりしないかを最低限だけ確かめる
      - name: Check what came out
        run: |
          count=$(find store-assets -name '*.png' | wc -l)
          echo "$count 枚"
          if [ "$count" -lt 10 ]; then
            echo "::error::画像が少なすぎます"
            exit 1
          fi
          # 真っ黒や空の画像は、極端に小さいファイルになる
          thin=$(find store-assets -name '*.png' -size -8k)
          if [ -n "$thin" ]; then
            echo "::error::中身の薄い画像があります"
            echo "$thin"
            exit 1
          fi
          echo "問題ありません"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: store-assets
          path: store-assets/
          if-no-files-found: error
