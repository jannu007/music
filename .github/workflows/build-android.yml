name: Build Android app

# スマホだけで .aab を作るための仕組み。
# GitHub の Actions タブから "Run workflow" を押すと、ここでビルドが走り、
# できあがったファイルを成果物（Artifacts）としてダウンロードできる。
# パソコンも Android Studio も要らない。

on:
  workflow_dispatch:
    inputs:
      app:
        description: 'ビルドするアプリ'
        required: true
        default: drums
        type: choice
        options:
          - synthesizer
          - piano
          - drums
          - guitar
          - bass
          - vocal
      versionCode:
        description: 'バージョンコード（Play にアップするたびに増やす整数）'
        required: true
        default: '2'
        type: string
      versionName:
        description: 'バージョン名（利用者に見える表記）'
        required: true
        default: '2.0.0'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      # 端末内で完結するバンドルを作り、外部参照が無いことを確かめる
      - name: Build the web app
        run: npm run build

      - name: Build offline bundle
        run: node scripts/build-native.mjs "${{ inputs.app }}"

      - name: Verify the bundle is self-contained
        run: node scripts/verify-native.mjs "${{ inputs.app }}"

      # Capacitor は Android のビルドにしか使わないので、ここでだけ入れる
      # （web 側の依存を増やさないため package.json には載せていない）
      - name: Install Capacitor
        run: npm install --no-save @capacitor/cli@^8 @capacitor/core@^8 @capacitor/android@^8

      - name: Create Android project
        run: npx cap add android

      - name: Copy the bundle into the project
        run: npx cap sync android

      - name: Set version
        run: |
          node - <<'EOF'
          const fs = require('fs');
          const f = 'android/app/build.gradle';
          let s = fs.readFileSync(f, 'utf8');
          s = s.replace(/versionCode\s+\d+/, 'versionCode ${{ inputs.versionCode }}');
          s = s.replace(/versionName\s+"[^"]*"/, 'versionName "${{ inputs.versionName }}"');
          fs.writeFileSync(f, s);
          console.log(s.match(/versionCode.*|versionName.*/g).join('\n'));
          EOF

      # 署名鍵が登録されていれば署名する。無ければ未署名のまま作る
      # （未署名でもビルドが通るかは確認できる。Play へ出すには署名が必要）
      - name: Decode keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload.jks
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "署名鍵を読み込みました"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "署名鍵が未登録のため、未署名でビルドします"
          fi

      - name: Add signing config
        if: ${{ steps.keystore.outputs.present == 'true' }}
        run: |
          node - <<'EOF'
          const fs = require('fs');
          const f = 'android/app/build.gradle';
          let s = fs.readFileSync(f, 'utf8');
          const signing = `
              signingConfigs {
                  release {
                      storeFile file('upload.jks')
                      storePassword System.getenv('KEYSTORE_PASSWORD')
                      keyAlias System.getenv('KEY_ALIAS')
                      keyPassword System.getenv('KEY_PASSWORD')
                  }
              }
          `;
          s = s.replace(/(android\s*\{)/, `$1\n${signing}`);
          s = s.replace(
              /(buildTypes\s*\{\s*release\s*\{)/,
              `$1\n            signingConfig signingConfigs.release`
          );
          fs.writeFileSync(f, s);
          EOF

      - name: Build .aab
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: cd android && ./gradlew bundleRelease --no-daemon

      - name: Build .apk (端末に直接入れて試す用)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: cd android && ./gradlew assembleRelease --no-daemon

      - name: Show what was produced
        run: |
          echo "署名: ${{ steps.keystore.outputs.present == 'true' && 'あり' || 'なし（Play へ出すには鍵の登録が必要）' }}"
          find android/app/build/outputs -name '*.aab' -o -name '*.apk' | while read -r f; do
            echo "$(du -h "$f" | cut -f1)  $f"
          done

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.app }}-${{ inputs.versionName }}
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
